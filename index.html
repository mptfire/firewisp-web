<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fire Wisp" />
    <title>Fire Wisp — Privacy-Focused Nostr Web Client</title>
    <meta
      name="description"
      content="Fire Wisp is an open-source, privacy-hardened Nostr web and Android client with sovereign sign-in (NIP-07, NIP-46 Bunker, NIP-49, NIP-06), built-in NIP-13 PoW anti-spam, Blossom media hosting, and Lightning zaps."
    />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0e0e11" />
    <link rel="canonical" href="https://firewisp.rtard.de/" />
    <link rel="icon" type="image/png" href="/firewisp-logo.png" />
    <link rel="apple-touch-icon" href="/firewisp-icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fire Wisp" />
    <meta property="og:title" content="Fire Wisp — Privacy-Focused Nostr Client" />
    <meta
      property="og:description"
      content="Sovereign, privacy-hardened Nostr client for web and Android with anti-spam PoW relay, Blossom media hosting, and Lightning zaps."
    />
    <meta property="og:url" content="https://firewisp.rtard.de/" />
    <meta property="og:image" content="https://firewisp.rtard.de/firewisp-icon-512.png" />

    <!-- Twitter / Social Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fire Wisp — Privacy-Focused Nostr Client" />
    <meta
      name="twitter:description"
      content="Sovereign, privacy-hardened Nostr client for web and Android. Direct APK and Zapstore downloads available."
    />
    <meta name="twitter:image" content="https://firewisp.rtard.de/firewisp-icon-512.png" />

  <body class="bg-[#0e0e11] text-[#f4f1ea] antialiased selection:bg-[#e8590c]/30 selection:text-white">
    <div id="root"></div>
    <noscript>
      <main style="max-width:680px;margin:48px auto;padding:24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#f4f1ea;">
        <img src="/firewisp-logo.png" alt="Fire Wisp logo" width="80" height="80" />
        <h1>Fire Wisp — Privacy-Focused Nostr Client</h1>
        <p>
          Fire Wisp is a sovereign, privacy-hardened Nostr client for Web and Android. Connect to
          <code>wss://firewisp.relay.rtard.de</code> with NIP-07 browser extensions, NIP-46 Bunker
          signers (Amber), NIP-49 encrypted keys, or BIP-39 recovery phrases. Zero Google sign-in,
          zero analytics, zero trackers.
        </p>
        <p>
          Enable JavaScript to use the interactive Fire Wisp web app, or download the Android app
          directly from <a href="https://app.firewisp.rtard.de/" style="color:#ff7b29;">app.firewisp.rtard.de</a>
          or <a href="https://zapstore.dev" style="color:#ff7b29;">Zapstore</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
